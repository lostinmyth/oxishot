[package]
name = "oxishot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A fast, minimal screenshot annotation editor: arrows, boxes, text, blur"
repository = "https://github.com/lostinmyth/oxishot"
readme = "README.md"
keywords = ["screenshot", "annotation", "editor", "image", "slint"]
categories = ["multimedia::images", "graphics"]
exclude = [".github/", "packaging/", "image.png"]

[dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
lexopt = "0.3.2"
parley = "0.11.1"
png = "0.18"
rfd = "0.18"
swash = "0.2.10"
toml_edit = "0.25"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }

[build-dependencies]
slint-build = "1.18.1"
